name: Build MYRA ULTRA (Windows EXE)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: MYRA_ULTRA_APP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MYRA_ULTRA_APP/requirements-build.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build MYRA Coder (Node.js / TypeScript)
        run: |
          cd myra_coder
          npm install
          npm run build
          test -f dist/run.js

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements-build.txt

      - name: Install Firebase client (best effort)
        run: |
          pip install pyrebase4 python-jwt || echo "WARNING: pyrebase4 install failed, continuing"

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller MYRA_ULTRA_CI.spec --noconfirm --clean

      - name: Check EXE
        run: |
          ls -lh dist
          test -f dist/MYRA_ULTRA.exe

      - name: Upload EXE (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MYRA_ULTRA-windows
          path: MYRA_ULTRA_APP/dist/MYRA_ULTRA.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (only for tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MYRA_ULTRA_APP/dist/MYRA_ULTRA.exe
